# Hand-written until infra-config generates this repo's presubmit (V0-CFG-02).
# Runs on every PR and in the merge queue, so the gate sees the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
      # sync's "no other parser" check: manifests are read only through qqsync (the pinned one).
      - name: no second manifest parser
        run: qqsync guard .
      # gate's agnosticism guard, as release runs it. TODO(expert): let rollers move this pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/gate
          ref: 02a1fb335c609b1d9b594dfeff52805b87dc93e2  # gate main after #29 (terms.toml names qq since #31)
          path: .qq/gate
          persist-credentials: false
      - name: core code names no language, build tool or deploy target (gate's agnosticism guard)
        run: |
          python -m venv .qq/gate-venv
          .qq/gate-venv/bin/pip install --quiet -e .qq/gate
          .qq/gate-venv/bin/qqgate guard --repo qq --github .

  # qq sync on macOS and native Windows: the portable tests (links into the store, sealing,
  # refusal of mismatched bytes, junctions on Windows) and the launcher each platform starts qq
  # with (bin/qq, bin/qq.cmd), from a fresh QQ_HOME.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider tests/test_portable.py
      - name: the launcher starts qq (macOS)
        if: runner.os == 'macOS'
        env:
          QQ_HOME: ${{ runner.temp }}/qq
        run: test "$(bin/qq --version)" = "qq $(python -c 'import qqdepot; print(qqdepot.__version__)')"
      - name: the launcher starts qq (Windows cmd)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          QQ_HOME: ${{ runner.temp }}\qq
          QQ_PYTHON: python   # setup-python's; without it qq.cmd tries `py -3.14` first
        run: |
          call bin\qq.cmd --version > "%RUNNER_TEMP%\version.txt" || exit /b 1
          type "%RUNNER_TEMP%\version.txt"
          findstr /b /c:"qq " "%RUNNER_TEMP%\version.txt" || exit /b 1
          call bin\qq.cmd build 2> "%RUNNER_TEMP%\build.txt"
          if not errorlevel 2 exit /b 1
          findstr /c:"does not run on Windows yet" "%RUNNER_TEMP%\build.txt" || exit /b 1
      # The default path: no QQ_PYTHON, so qq.cmd starts qq with `py -3.14` (setup-python
      # registers 3.14 with the py launcher).
      - name: the launcher starts qq with its default Python (Windows cmd)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          QQ_HOME: ${{ runner.temp }}\qq-default
        run: |
          set QQ_PYTHON=
          call bin\qq.cmd --version || exit /b 1
      # The fallback: with no py launcher on PATH, qq.cmd takes setup-python's `python`.
      - name: the launcher falls back to python on PATH (Windows cmd)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          QQ_HOME: ${{ runner.temp }}\qq-fallback
        run: |
          set QQ_PYTHON=
          for %%I in (python.exe) do set "pydir=%%~dp$PATH:I"
          set "PATH=%pydir%;%SystemRoot%\System32"
          where py >nul 2>nul && exit /b 1
          call bin\qq.cmd --version || exit /b 1

  # Limits: both runners share paths and user, and a red run fails before the compare, so
  # parity is shown for green runs; innernet's results are one case per action (no test suite).
  # V0-DEP-03 done-when on the real product repos: `qq test` (what a contributor runs) and
  # `qqrecipes execute` (what CI runs) on separate runners, same commit, same JUnit results.
  # The manifests are sync's onboarding fixtures until onboarding lands infra/repo.toml in each
  # repo; toolchains come from setup actions at the toolchains pins until qq sync can pull them
  # (public ghcr packages and promoted pins).
  parity:
    strategy:
      fail-fast: false
      matrix:
        repo: [xo-space, innernet]
        side: [local, ci]
        include:
          - repo: xo-space
            ref: 3bb8687307144ab604723e7c13f49753b22dc0e0  # TODO(expert): let rollers move these pins.
          - repo: innernet
            ref: da9b84cf811f4358e3ee0b5d9d4388b69bf481e9
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: python
        with:
          python-version: "3.14.8"  # the CPython the manifests pin
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: matrix.repo == 'innernet'
        with:
          node-version: "24.21.0"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        if: matrix.repo == 'innernet'
        with:
          version: "11.28.2"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: .qq/product
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/sync
          ref: 9821f745690d5150cac70cd2eee54c97d431e6c3  # the qqsync depot pins
          path: .qq/sync
      - name: give the product its onboarding manifest
        run: |
          mkdir -p .qq/product/infra
          cp .qq/sync/tests/fixtures/${{ matrix.repo }}.repo.toml .qq/product/infra/repo.toml
          echo "PYROOT=$(dirname "$(dirname "${{ steps.python.outputs.python-path }}")")" >> "$GITHUB_ENV"
      - name: local, as a contributor runs it
        if: matrix.side == 'local'
        working-directory: .qq/product
        env:
          QQ_HOME: ${{ runner.temp }}/qq
        run: "$GITHUB_WORKSPACE/bin/qq test --toolchain python=$PYROOT --out $GITHUB_WORKSPACE/.qq/out"
      - name: CI, as presubmit runs it
        if: matrix.side == 'ci'
        run: |
          python -m pip install --quiet .  # recipes at the commit depot pins, so both sides match
          qqrecipes execute test --repo .qq/product --out .qq/out --toolchain python=$PYROOT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: parity-${{ matrix.repo }}-${{ matrix.side }}
          path: .qq/out/
          if-no-files-found: error

  # A required check. It always runs, so a red or cancelled parity leg fails it instead of
  # skipping it: GitHub counts a skipped required check as passing.
  parity-compare:
    needs: parity
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every parity leg passed
        if: needs.parity.result != 'success'
        run: |
          echo "::error::parity finished ${{ needs.parity.result }}, so local and CI results were not compared"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: results
      - name: same JUnit results, local and CI
        run: |
          for repo in xo-space innernet; do
            echo "== $repo"
            python3 tools/junit_compare.py "results/parity-$repo-local" "results/parity-$repo-ci"
          done

  # V0-DEP-04 against the real services, read-only: the pinned gate installs and computes the
  # product repos' required checks from infra-config, and `qq status` reads this very change
  # through the real `gh` (qq is not a product repo in infra-config, so it is judged ungated).
  # Submitting (try, land) is shown end to end with a fake gh in tests/test_change.py.
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet .
      - name: the pinned gate decides what xo-space and innernet must pass
        env:
          QQ_HOME: ${{ runner.temp }}/qq
        run: |
          python - <<'PY'
          from qqdepot import gate
          for repo, check in (("quirq-ai/xo-space", "xo-space-presubmit"), ("quirq-ai/innernet", "innernet-presubmit")):
              names = [c["name"] for c in gate.required(repo)["required"]]
              print(repo, names)
              assert check in names, (repo, names)
          assert gate.required("quirq-ai/qq") is None, "qq is not a product repo in infra-config, so it is ungated"
          PY
      - name: qq status reads this change through gh
        if: github.event_name == 'pull_request'
        env:
          QQ_HOME: ${{ runner.temp }}/qq
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0; qq status "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" || rc=$?
          # 0 pass, 1 refused, 3 pending (this job is still running); 2 means qq could not decide.
          [ "$rc" -ne 2 ] || { echo "::error::qq status could not decide"; exit 1; }
